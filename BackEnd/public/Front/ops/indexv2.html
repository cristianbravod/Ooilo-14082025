<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍽️ Sistema Cocina - Táctil</title>
    <style>
        /* ==========================================
           ESTILOS BASE Y VARIABLES
           ========================================== */
        :root {
            --primary-color: #1a365d;
            --secondary-color: #4a5568;
            --success-color: #38a169;
            --warning-color: #ed8936;
            --danger-color: #e53e3e;
            --info-color: #3182ce;
            --light-bg: #f7fafc;
            --dark-bg: #1a202c;
            --border-color: #e2e8f0;
            --text-color: #2d3748;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.2);
            --border-radius: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            color: var(--text-color);
            line-height: 1.6;
        }

        /* ==========================================
           HEADER MODERNO
           ========================================== */
        .header {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.75rem;
            font-weight: 800;
            color: white;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .nav-tabs {
            display: flex;
            gap: 0.5rem;
            list-style: none;
            background: rgba(255, 255, 255, 0.1);
            padding: 0.5rem;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .nav-tab {
            padding: 1rem 2rem;
            border-radius: 16px;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-tab:hover {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            transform: translateY(-2px);
        }

        .nav-tab.active {
            background: rgba(255, 255, 255, 0.9);
            color: var(--primary-color);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            color: white;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #48bb78;
            animation: pulse 2s infinite;
            box-shadow: 0 0 0 0 rgba(72, 187, 120, 0.4);
        }

        .status-dot.disconnected {
            background: var(--danger-color);
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(72, 187, 120, 0.7);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(72, 187, 120, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(72, 187, 120, 0);
            }
        }

        /* ==========================================
           CONTENIDO PRINCIPAL
           ========================================== */
        .main-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 2rem;
        }

        .section {
            display: none;
            background: rgba(255, 255, 255, 0.95);
            border-radius: var(--border-radius);
            padding: 2.5rem;
            box-shadow: var(--shadow);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .section.active {
            display: block;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            border-bottom: 3px solid var(--primary-color);
            padding-bottom: 1.5rem;
        }

        .section-title {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--info-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ==========================================
           DASHBOARD STATS
           ========================================== */
        .dashboard-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            padding: 2.5rem;
            border-radius: var(--border-radius);
            border: 2px solid transparent;
            text-align: center;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent);
            transition: left 0.6s;
        }

        .stat-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary-color);
        }

        .stat-card:hover::before {
            left: 100%;
        }

        .stat-number {
            font-size: 4rem;
            font-weight: 900;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .stat-label {
            color: var(--secondary-color);
            font-size: 1.2rem;
            font-weight: 600;
        }

        .stat-pendientes { color: var(--danger-color); }
        .stat-preparacion { color: var(--warning-color); }
        .stat-listos { color: var(--success-color); }
        .stat-entregados { color: var(--info-color); }

        /* ==========================================
           CONTROLES DE COCINA
           ========================================== */
        .kitchen-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            gap: 2rem;
        }

        .auto-refresh {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: rgba(255, 255, 255, 0.8);
            padding: 1rem 2rem;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .toggle-switch {
            position: relative;
            width: 70px;
            height: 36px;
            background: var(--secondary-color);
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .toggle-switch.active {
            background: var(--success-color);
            box-shadow: 0 0 20px rgba(56, 161, 105, 0.4);
        }

        .toggle-switch::before {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 30px;
            height: 30px;
            background: white;
            border-radius: 50%;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .toggle-switch.active::before {
            transform: translateX(34px);
        }

        /* ==========================================
           GRID DE ÓRDENES
           ========================================== */
        .kitchen-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(450px, 1fr));
            gap: 2rem;
        }

        /* ==========================================
           TARJETAS DE ÓRDENES TÁCTILES
           ========================================== */
        .order-card {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            border-radius: var(--border-radius);
            padding: 2rem;
            border-left: 6px solid var(--border-color);
            box-shadow: var(--shadow);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            border: 2px solid transparent;
        }

        .order-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary-color);
        }

        .order-card.pendiente { border-left-color: var(--danger-color); }
        .order-card.en_preparacion { border-left-color: var(--warning-color); }
        .order-card.listo { border-left-color: var(--success-color); }
        .order-card.entregado { border-left-color: var(--info-color); }

        .order-card.priority-alta {
            animation: priorityGlow 2s infinite alternate;
            border-left-width: 8px;
        }

        @keyframes priorityGlow {
            0% { box-shadow: var(--shadow); }
            100% { box-shadow: 0 0 30px rgba(229, 62, 62, 0.3), var(--shadow); }
        }

        .order-card.priority-alta::after {
            content: '🚨 ALTA PRIORIDAD';
            position: absolute;
            top: -10px;
            right: -10px;
            background: linear-gradient(135deg, var(--danger-color) 0%, #c53030 100%);
            color: white;
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
            font-weight: bold;
            border-radius: 20px;
            transform: rotate(15deg);
            box-shadow: 0 4px 15px rgba(229, 62, 62, 0.3);
            animation: shake 0.5s ease-in-out infinite alternate;
        }

        @keyframes shake {
            0% { transform: rotate(15deg) translateX(0px); }
            100% { transform: rotate(15deg) translateX(2px); }
        }

        /* ==========================================
           HEADER DE ORDEN
           ========================================== */
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #e2e8f0;
        }

        .order-mesa {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        .order-time {
            font-size: 1rem;
            color: var(--secondary-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
        }

        .kitchen-timer {
            background: linear-gradient(135deg, var(--danger-color) 0%, #c53030 100%);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: bold;
            animation: urgentBlink 1s infinite;
            box-shadow: 0 4px 15px rgba(229, 62, 62, 0.3);
        }

        @keyframes urgentBlink {
            0%, 50% { opacity: 1; transform: scale(1); }
            51%, 100% { opacity: 0.7; transform: scale(0.95); }
        }

        .order-total {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--success-color);
            margin-top: 0.5rem;
        }

        .order-status-badge {
            padding: 0.75rem 1.5rem;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            text-align: center;
            min-width: 120px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .status-pendiente { 
            background: linear-gradient(135deg, #fed7d7 0%, #fc8181 100%); 
            color: #c53030; 
        }
        .status-en_preparacion { 
            background: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%); 
            color: #d68910; 
        }
        .status-listo { 
            background: linear-gradient(135deg, #c6f6d5 0%, #68d391 100%); 
            color: #2f855a; 
        }
        .status-entregado { 
            background: linear-gradient(135deg, #bee3f8 0%, #63b3ed 100%); 
            color: #2a69ac; 
        }

        /* ==========================================
           ITEMS DE ÓRDENES TÁCTILES
           ========================================== */
        .order-items {
            margin: 2rem 0;
        }

        .order-item {
            background: linear-gradient(135deg, #f8fafc 0%, #edf2f7 100%);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            position: relative;
        }

        .order-item:hover {
            background: linear-gradient(135deg, #edf2f7 0%, #e2e8f0 100%);
            border-color: var(--primary-color);
            transform: translateX(4px);
        }

        .item-info {
            margin-bottom: 1rem;
        }

        .item-name {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-color);
            margin-bottom: 0.5rem;
        }

        .item-details {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .item-quantity {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--info-color) 100%);
            color: white;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .item-price {
            color: var(--success-color);
            font-weight: 700;
            font-size: 1.1rem;
        }

        .item-status-current {
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .item-observations {
            background: linear-gradient(135deg, #e6fffa 0%, #b2f5ea 100%);
            border: 2px solid #4fd1c7;
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
            font-style: italic;
            color: #234e52;
            font-size: 0.95rem;
            position: relative;
        }

        .item-observations::before {
            content: '📝';
            position: absolute;
            top: -8px;
            left: 10px;
            background: white;
            padding: 0 0.5rem;
            font-size: 1.2rem;
        }

        /* ==========================================
           BOTONES TÁCTILES DE ESTADOS
           ========================================== */
        .item-status-buttons {
            display: flex;
            gap: 0.75rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .status-btn {
            flex: 1;
            min-width: 100px;
            padding: 1rem 1.5rem;
            border: 3px solid transparent;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            min-height: 60px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .status-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .status-btn:active {
            transform: translateY(0);
            transition: transform 0.1s ease;
        }

        .status-btn.active {
            border-width: 4px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            transform: scale(1.05);
        }

        /* Estados de botones */
        .status-btn.pendiente {
            background: linear-gradient(135deg, #fed7d7 0%, #feb2b2 100%);
            color: #c53030;
            border-color: #fc8181;
        }

        .status-btn.pendiente.active {
            background: linear-gradient(135deg, #fc8181 0%, #e53e3e 100%);
            color: white;
            border-color: #c53030;
        }

        .status-btn.en_preparacion {
            background: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%);
            color: #d68910;
            border-color: #f6ad55;
        }

        .status-btn.en_preparacion.active {
            background: linear-gradient(135deg, #f6ad55 0%, #ed8936 100%);
            color: white;
            border-color: #d68910;
        }

        .status-btn.listo {
            background: linear-gradient(135deg, #c6f6d5 0%, #9ae6b4 100%);
            color: #2f855a;
            border-color: #68d391;
        }

        .status-btn.listo.active {
            background: linear-gradient(135deg, #68d391 0%, #38a169 100%);
            color: white;
            border-color: #2f855a;
        }

        .status-btn.entregado {
            background: linear-gradient(135deg, #bee3f8 0%, #90cdf4 100%);
            color: #2a69ac;
            border-color: #63b3ed;
        }

        .status-btn.entregado.active {
            background: linear-gradient(135deg, #63b3ed 0%, #3182ce 100%);
            color: white;
            border-color: #2a69ac;
        }

        .status-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ==========================================
           BOTONES DE ACCIÓN GENERALES
           ========================================== */
        .btn {
            padding: 1rem 2rem;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            min-height: 60px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.6s;
        }

        .btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:active {
            transform: translateY(-1px);
            transition: transform 0.1s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--info-color) 100%);
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success-color) 0%, #2f855a 100%);
            color: white;
        }

        .btn-warning {
            background: linear-gradient(135deg, var(--warning-color) 0%, #d68910 100%);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger-color) 0%, #c53030 100%);
            color: white;
        }

        .btn-secondary {
            background: linear-gradient(135deg, var(--secondary-color) 0%, #2d3748 100%);
            color: white;
        }

        .btn-sm {
            padding: 0.75rem 1.5rem;
            font-size: 0.9rem;
            min-height: 50px;
        }

        /* ==========================================
           ACCIONES DE ORDEN
           ========================================== */
        .order-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 2px solid #e2e8f0;
            gap: 1rem;
        }

        .order-general-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .order-status-buttons {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .order-status-btn {
            padding: 0.75rem 1.25rem;
            border: 3px solid transparent;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 110px;
            min-height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .deliver-order-btn {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            box-shadow: 0 6px 25px rgba(72, 187, 120, 0.3);
            animation: deliverGlow 2s ease-in-out infinite alternate;
        }

        @keyframes deliverGlow {
            0% { box-shadow: 0 6px 25px rgba(72, 187, 120, 0.3); }
            100% { box-shadow: 0 10px 35px rgba(72, 187, 120, 0.5); }
        }

        .deliver-order-btn:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 40px rgba(72, 187, 120, 0.5);
        }

        .deliver-order-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.8s;
        }

        .deliver-order-btn:hover::before {
            left: 100%;
        }

        /* ==========================================
           NOTAS Y OBSERVACIONES
           ========================================== */
        .order-observations {
            background: linear-gradient(135deg, #e6fffa 0%, #b2f5ea 100%);
            border-left: 6px solid #4fd1c7;
            border-radius: 12px;
            padding: 1.5rem;
            margin: 1.5rem 0;
            position: relative;
            box-shadow: 0 4px 15px rgba(79, 209, 197, 0.2);
        }

        .order-observations.urgent {
            background: linear-gradient(135deg, #fed7d7 0%, #feb2b2 100%);
            border-left-color: #f56565;
            animation: urgentPulse 2s infinite;
            box-shadow: 0 4px 15px rgba(245, 101, 101, 0.3);
        }

        @keyframes urgentPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .order-observations .icon {
            font-size: 1.5rem;
            margin-right: 1rem;
        }

        /* ==========================================
           MODAL MODERNO
           ========================================== */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            border-radius: var(--border-radius);
            padding: 3rem;
            max-width: 700px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            box-shadow: var(--shadow-lg);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: var(--danger-color);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            background: #c53030;
            transform: scale(1.1);
        }

        /* ==========================================
           NOTIFICACIONES
           ========================================== */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 1.5rem 2rem;
            border-radius: 12px;
            color: white;
            font-weight: 700;
            font-size: 1.1rem;
            z-index: 1001;
            transform: translateX(100%);
            transition: all 0.4s ease;
            box-shadow: var(--shadow);
            min-width: 300px;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.success { 
            background: linear-gradient(135deg, var(--success-color) 0%, #2f855a 100%); 
        }
        .notification.error { 
            background: linear-gradient(135deg, var(--danger-color) 0%, #c53030 100%); 
        }
        .notification.warning { 
            background: linear-gradient(135deg, var(--warning-color) 0%, #d68910 100%); 
        }
        .notification.info { 
            background: linear-gradient(135deg, var(--info-color) 0%, #2a69ac 100%); 
        }

        /* ==========================================
           RESPONSIVE DESIGN MEJORADO
           ========================================== */
        @media (max-width: 768px) {
            .header {
                padding: 1rem;
                flex-direction: column;
                gap: 1.5rem;
            }

            .nav-tabs {
                flex-wrap: wrap;
                justify-content: center;
                padding: 0.75rem;
            }

            .nav-tab {
                padding: 0.75rem 1.5rem;
                font-size: 0.9rem;
                min-height: 50px;
            }

            .main-container {
                padding: 1rem;
            }

            .kitchen-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }

            .dashboard-stats {
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
            }

            .order-actions {
                flex-direction: column;
                align-items: stretch;
                gap: 1.5rem;
            }

            .order-general-actions {
                justify-content: center;
                flex-wrap: wrap;
            }

            .item-status-buttons {
                grid-template-columns: repeat(2, 1fr);
            }

            .order-status-buttons {
                justify-content: center;
                flex-wrap: wrap;
            }

            .section-title {
                font-size: 2rem;
            }

            .modal-content {
                padding: 2rem;
                margin: 1rem;
            }
        }

        @media (max-width: 480px) {
            .item-status-buttons {
                grid-template-columns: 1fr;
            }

            .status-btn {
                min-width: auto;
                flex: none;
            }

            .btn {
                padding: 0.75rem 1.5rem;
                font-size: 0.9rem;
            }
        }

        /* ==========================================
           ANIMACIONES ADICIONALES
           ========================================== */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .order-card {
            animation: fadeInUp 0.6s ease-out;
        }

        .order-card:nth-child(even) {
            animation-delay: 0.1s;
        }

        .order-card:nth-child(3n) {
            animation-delay: 0.2s;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo">
            <span>🍽️</span>
            <span>Sistema Cocina Táctil</span>
        </div>
        
        <nav class="nav-tabs">
            <button class="nav-tab active" onclick="showSection('dashboard')">📊 Dashboard</button>
            <button class="nav-tab" onclick="showSection('kitchen')">👨‍🍳 Cocina</button>
            <button class="nav-tab" onclick="showSection('admin')">👥 Administración</button>
        </nav>
        
        <div class="user-info">
            <div class="connection-status">
                <div class="status-dot" id="connectionDot"></div>
                <span id="connectionText">Conectado</span>
            </div>
            <span id="userInfo">Chef Principal</span>
            <button class="btn btn-secondary btn-sm" onclick="logout()">🚪 Salir</button>
        </div>
    </header>

    <!-- Contenido Principal -->
    <div class="main-container">
        <!-- Dashboard -->
        <section id="dashboard" class="section active">
            <div class="section-header">
                <h2 class="section-title">📊 Dashboard</h2>
                <button class="btn btn-primary" onclick="refreshDashboard()">🔄 Actualizar</button>
            </div>
            
            <div class="dashboard-stats">
                <div class="stat-card">
                    <div class="stat-number stat-pendientes" id="statPendientes">-</div>
                    <div class="stat-label">⏳ Pendientes</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number stat-preparacion" id="statPreparacion">-</div>
                    <div class="stat-label">🔥 En Preparación</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number stat-listos" id="statListos">-</div>
                    <div class="stat-label">✅ Listos</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number stat-entregados" id="statEntregados">-</div>
                    <div class="stat-label">📦 Entregados</div>
                </div>
            </div>
        </section>

        <!-- Cocina -->
        <section id="kitchen" class="section">
            <div class="section-header">
                <h2 class="section-title">👨‍🍳 Cocina</h2>
                <div class="kitchen-controls">
                    <div class="auto-refresh">
                        <span style="font-weight: 600;">Auto-actualizar:</span>
                        <div class="toggle-switch active" id="autoRefreshToggle" onclick="toggleAutoRefresh()"></div>
                    </div>
                    <button class="btn btn-primary" onclick="refreshKitchen()">🔄 Actualizar</button>
                </div>
            </div>
            
            <div class="kitchen-grid" id="kitchenGrid">
                <!-- Las órdenes se cargarán aquí dinámicamente -->
            </div>
        </section>

        <!-- Administración -->
        <section id="admin" class="section">
            <div class="section-header">
                <h2 class="section-title">👥 Administración</h2>
                <button class="btn btn-primary" onclick="refreshAdmin()">🔄 Actualizar</button>
            </div>
            
            <div class="kitchen-grid" id="adminGrid">
                <!-- Las órdenes se cargarán aquí dinámicamente -->
            </div>
        </section>
    </div>

    <!-- Modal para detalles de orden -->
    <div id="orderModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div id="modalBody">
                <!-- Contenido del modal se carga dinámicamente -->
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURACIÓN Y ESTADO GLOBAL
        // ==========================================
        
        // Estados de pedidos mejorados
        const ORDER_STATES = {
            'pendiente': { priority: 1, label: '⏳ Pendiente', color: 'pendiente' },
            'en_preparacion': { priority: 2, label: '🔥 En Preparación', color: 'en_preparacion' },
            'listo': { priority: 3, label: '✅ Listo', color: 'listo' },
            'entregado': { priority: 4, label: '📦 Entregado', color: 'entregado' }
        };

        // Estados de items individuales
        const ITEM_STATES = {
            'pendiente': { label: '⏳ Pendiente', color: 'pendiente' },
            'en_preparacion': { label: '🔥 En Preparación', color: 'en_preparacion' },
            'listo': { label: '✅ Listo', color: 'listo' },
            'entregado': { label: '📦 Entregado', color: 'entregado' }
        };

        // Estado global
        let currentSection = 'dashboard';
        let orders = [];
        let autoRefreshInterval = null;
        let isConnected = true;

        // ==========================================
        // DATOS DE EJEMPLO MEJORADOS
        // ==========================================
        
        function getDemoOrders() {
            return [
                {
                    id: 1,
                    mesa: 'Mesa 3',
                    estado: 'pendiente',
                    fecha_creacion: new Date(Date.now() - 5 * 60000).toISOString(),
                    total: 15500,
                    items: [
                        { 
                            id: 1, 
                            nombre: 'Hamburguesa Especial', 
                            cantidad: 1, 
                            precio: 9000, 
                            estado: 'pendiente', 
                            observaciones: 'Sin cebolla, extra queso'
                        },
                        { 
                            id: 2, 
                            nombre: 'Papas Fritas', 
                            cantidad: 2, 
                            precio: 4000, 
                            estado: 'pendiente', 
                            observaciones: 'Extra crujientes'
                        },
                        { 
                            id: 3, 
                            nombre: 'Coca Cola', 
                            cantidad: 2, 
                            precio: 2500, 
                            estado: 'listo', 
                            observaciones: ''
                        }
                    ],
                    notas: 'Cliente con prisa - Mesa VIP',
                    prioridad: 'MEDIA'
                },
                {
                    id: 2,
                    mesa: 'Mesa 7',
                    estado: 'en_preparacion',
                    fecha_creacion: new Date(Date.now() - 15 * 60000).toISOString(),
                    total: 18000,
                    items: [
                        { 
                            id: 4, 
                            nombre: 'Pizza Margherita', 
                            cantidad: 1, 
                            precio: 12000, 
                            estado: 'en_preparacion', 
                            observaciones: 'Extra queso, masa delgada'
                        },
                        { 
                            id: 5, 
                            nombre: 'Ensalada César', 
                            cantidad: 1, 
                            precio: 6000, 
                            estado: 'listo', 
                            observaciones: 'Sin pollo, extra crutones'
                        }
                    ],
                    notas: 'Mesa empresarial - Reunión importante',
                    prioridad: 'ALTA'
                },
                {
                    id: 3,
                    mesa: 'Mesa 1',
                    estado: 'listo',
                    fecha_creacion: new Date(Date.now() - 35 * 60000).toISOString(),
                    total: 16500,
                    items: [
                        { 
                            id: 6, 
                            nombre: 'Lomo a la Plancha', 
                            cantidad: 1, 
                            precio: 16500, 
                            estado: 'listo', 
                            observaciones: 'Término medio, con puré'
                        }
                    ],
                    notas: '',
                    prioridad: 'NORMAL'
                },
                {
                    id: 4,
                    mesa: 'Barra 2',
                    estado: 'entregado',
                    fecha_creacion: new Date(Date.now() - 50 * 60000).toISOString(),
                    total: 22000,
                    items: [
                        { 
                            id: 7, 
                            nombre: 'Salmón Grillado', 
                            cantidad: 1, 
                            precio: 18000, 
                            estado: 'entregado', 
                            observaciones: 'Con salsa teriyaki'
                        },
                        { 
                            id: 8, 
                            nombre: 'Vino Blanco', 
                            cantidad: 1, 
                            precio: 4000, 
                            estado: 'entregado', 
                            observaciones: 'Bien frío'
                        }
                    ],
                    notas: '',
                    prioridad: 'NORMAL'
                }
            ];
        }

        // ==========================================
        // FUNCIONES DE NAVEGACIÓN
        // ==========================================
        
        function showSection(sectionName) {
            // Ocultar todas las secciones
            document.querySelectorAll('.section').forEach(section => {
                section.classList.remove('active');
            });
            
            // Remover clase activa de todos los tabs
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Mostrar la sección seleccionada
            document.getElementById(sectionName).classList.add('active');
            event.target.classList.add('active');
            
            currentSection = sectionName;
            
            // Cargar datos específicos de la sección
            switch (sectionName) {
                case 'dashboard':
                    refreshDashboard();
                    break;
                case 'kitchen':
                    refreshKitchen();
                    break;
                case 'admin':
                    refreshAdmin();
                    break;
            }
        }

        // ==========================================
        // FUNCIONES DE ACTUALIZACIÓN DE DATOS
        // ==========================================
        
        function refreshDashboard() {
            orders = getDemoOrders();
            updateDashboardStats();
        }

        function refreshKitchen() {
            orders = getDemoOrders().filter(order => 
                ['pendiente', 'en_preparacion', 'listo'].includes(order.estado)
            );
            renderKitchenOrders();
        }

        function refreshAdmin() {
            orders = getDemoOrders();
            renderAdminOrders();
        }

        function updateDashboardStats() {
            const stats = {
                pendientes: orders.filter(o => o.estado === 'pendiente').length,
                preparacion: orders.filter(o => o.estado === 'en_preparacion').length,
                listos: orders.filter(o => o.estado === 'listo').length,
                entregados: orders.filter(o => o.estado === 'entregado').length
            };

            document.getElementById('statPendientes').textContent = stats.pendientes;
            document.getElementById('statPreparacion').textContent = stats.preparacion;
            document.getElementById('statListos').textContent = stats.listos;
            document.getElementById('statEntregados').textContent = stats.entregados;
        }

        // ==========================================
        // RENDERIZADO DE ÓRDENES MEJORADO
        // ==========================================
        
        function renderKitchenOrders() {
            const container = document.getElementById('kitchenGrid');
            container.innerHTML = '';
            
            if (orders.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 4rem; color: var(--secondary-color);">
                        <div style="font-size: 4rem; margin-bottom: 2rem;">🍽️</div>
                        <h3 style="font-size: 2rem; margin-bottom: 1rem;">No hay órdenes pendientes</h3>
                        <p style="font-size: 1.2rem; opacity: 0.8;">Las nuevas órdenes aparecerán aquí automáticamente</p>
                    </div>
                `;
                return;
            }

            // Ordenar por prioridad y tiempo
            const sortedOrders = [...orders].sort((a, b) => {
                const priorityA = ORDER_STATES[a.estado]?.priority || 5;
                const priorityB = ORDER_STATES[b.estado]?.priority || 5;
                
                if (priorityA !== priorityB) {
                    return priorityA - priorityB;
                }
                
                return new Date(a.fecha_creacion) - new Date(b.fecha_creacion);
            });

            sortedOrders.forEach(order => {
                container.appendChild(createOrderCard(order, true));
            });
        }

        function renderAdminOrders() {
            const container = document.getElementById('adminGrid');
            container.innerHTML = '';
            
            orders.forEach(order => {
                container.appendChild(createOrderCard(order, false));
            });
        }

        function createOrderCard(order, isKitchen) {
            const orderTime = new Date(order.fecha_creacion);
            const timeDiff = Math.floor((Date.now() - orderTime.getTime()) / 60000);
            const stateInfo = ORDER_STATES[order.estado] || ORDER_STATES['pendiente'];
            
            const orderCard = document.createElement('div');
            orderCard.className = `order-card ${order.estado} ${order.prioridad === 'ALTA' ? 'priority-alta' : ''}`;
            
            orderCard.innerHTML = `
                <div class="order-header">
                    <div>
                        <div class="order-mesa">${order.mesa}</div>
                        <div class="order-time">
                            🕒 Hace ${timeDiff} min 
                            ${timeDiff > 30 ? '<span class="kitchen-timer">⚠️ URGENTE</span>' : ''}
                        </div>
                        <div class="order-total">💰 $${order.total.toLocaleString('es-CL')}</div>
                    </div>
                    <div>
                        <div class="order-status-badge status-${order.estado}">
                            ${stateInfo.label}
                        </div>
                    </div>
                </div>
                
                <div class="order-items">
                    ${order.items.map(item => createOrderItem(item, order.id)).join('')}
                </div>
                
                ${order.notas ? `
                    <div class="order-observations ${timeDiff > 30 || order.prioridad === 'ALTA' ? 'urgent' : ''}">
                        <span class="icon">${timeDiff > 30 || order.prioridad === 'ALTA' ? '🚨' : '📝'}</span>
                        <strong>Notas:</strong> ${order.notas}
                    </div>
                ` : ''}
                
                <div class="order-actions">
                    <div>
                        <button class="btn btn-secondary btn-sm" onclick="showOrderDetails(${order.id})">
                            👁️ Ver Detalles
                        </button>
                    </div>
                    
                    <div class="order-general-actions">
                        ${getOrderStatusButtons(order)}
                        ${isKitchen && order.estado === 'listo' ? `
                            <button class="deliver-order-btn" onclick="deliverCompleteOrder(${order.id})">
                                📦 Entregar Completa
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
            
            return orderCard;
        }

        function createOrderItem(item, orderId) {
            const stateInfo = ITEM_STATES[item.estado] || ITEM_STATES['pendiente'];
            
            return `
                <div class="order-item">
                    <div class="item-info">
                        <div class="item-name">${item.nombre}</div>
                        <div class="item-details">
                            <span class="item-quantity">${item.cantidad}x</span>
                            <span class="item-price">$${(item.precio * item.cantidad).toLocaleString('es-CL')}</span>
                            <span class="item-status-current status-${item.estado}">${stateInfo.label}</span>
                        </div>
                        ${item.observaciones ? `
                            <div class="item-observations">
                                <strong>Observaciones:</strong> ${item.observaciones}
                            </div>
                        ` : ''}
                    </div>
                    
                    <div class="item-status-buttons">
                        ${createItemStatusButtons(orderId, item)}
                    </div>
                </div>
            `;
        }

        function createItemStatusButtons(orderId, item) {
            const states = ['pendiente', 'en_preparacion', 'listo', 'entregado'];
            
            return states.map(state => {
                const stateInfo = ITEM_STATES[state];
                const isActive = item.estado === state;
                const isDisabled = item.estado === 'entregado' && state !== 'entregado';
                
                return `
                    <button 
                        class="status-btn ${state} ${isActive ? 'active' : ''}" 
                        onclick="changeItemStatus(${orderId}, ${item.id}, '${state}')"
                        ${isDisabled ? 'disabled' : ''}
                    >
                        ${stateInfo.label}
                    </button>
                `;
            }).join('');
        }

        function getOrderStatusButtons(order) {
            if (order.estado === 'entregado') {
                return `
                    <div style="display: flex; align-items: center; gap: 0.5rem; color: var(--success-color); font-weight: bold; font-size: 1.1rem;">
                        ✅ Orden Completada
                    </div>
                `;
            }

            const states = ['pendiente', 'en_preparacion', 'listo', 'entregado'];
            
            return `
                <div class="order-status-buttons">
                    ${states.map(state => {
                        const stateInfo = ORDER_STATES[state];
                        const isActive = order.estado === state;
                        
                        return `
                            <button 
                                class="status-btn order-status-btn ${state} ${isActive ? 'active' : ''}" 
                                onclick="changeOrderStatus(${order.id}, '${state}')"
                            >
                                ${stateInfo.label}
                            </button>
                        `;
                    }).join('')}
                </div>
            `;
        }

        // ==========================================
        // FUNCIONES DE CAMBIO DE ESTADO MEJORADAS
        // ==========================================
        
        function changeItemStatus(orderId, itemId, newStatus) {
            const order = orders.find(o => o.id === orderId);
            if (!order) return;

            const item = order.items.find(i => i.id === itemId);
            if (!item) return;

            // Actualizar estado del item
            item.estado = newStatus;

            // Lógica automática de actualización del estado de la orden
            updateOrderStatusBasedOnItems(order);

            // Mostrar notificación
            showNotification(`🍽️ "${item.nombre}" → ${ITEM_STATES[newStatus].label}`, 'success');

            // Refrescar vista
            refreshCurrentSection();
        }

        function changeOrderStatus(orderId, newStatus) {
            const order = orders.find(o => o.id === orderId);
            if (!order) return;

            // Actualizar estado de la orden
            order.estado = newStatus;

            // Si se marca como entregado, marcar todos los items como entregados
            if (newStatus === 'entregado') {
                order.items.forEach(item => {
                    item.estado = 'entregado';
                });
            }

            // Mostrar notificación
            showNotification(`📋 ${order.mesa} → ${ORDER_STATES[newStatus].label}`, 'success');

            // Refrescar vista
            refreshCurrentSection();
        }

        function deliverCompleteOrder(orderId) {
            const order = orders.find(o => o.id === orderId);
            if (!order) return;

            // Confirmar acción
            if (!confirm(`¿Confirmar entrega completa de ${order.mesa}?\n\nEsta acción marcará todos los items como entregados.`)) {
                return;
            }

            // Marcar orden y todos sus items como entregados
            order.estado = 'entregado';
            order.items.forEach(item => {
                item.estado = 'entregado';
            });

            // Mostrar notificación de éxito con animación especial
            showNotification(`🎉 ${order.mesa} entregada completamente`, 'success');

            // Refrescar vista después de un breve delay para mostrar la animación
            setTimeout(() => {
                refreshCurrentSection();
            }, 1000);
        }

        function updateOrderStatusBasedOnItems(order) {
            const items = order.items;
            const pendientes = items.filter(i => i.estado === 'pendiente').length;
            const preparacion = items.filter(i => i.estado === 'en_preparacion').length;
            const listos = items.filter(i => i.estado === 'listo').length;
            const entregados = items.filter(i => i.estado === 'entregado').length;

            // Lógica automática de estado
            if (entregados === items.length) {
                order.estado = 'entregado';
            } else if (listos > 0 && (pendientes + preparacion) === 0) {
                order.estado = 'listo';
            } else if (preparacion > 0) {
                order.estado = 'en_preparacion';
            } else {
                order.estado = 'pendiente';
            }
        }

        // ==========================================
        // FUNCIONES DE MODAL Y UTILIDADES
        // ==========================================
        
        function showOrderDetails(orderId) {
            const order = orders.find(o => o.id === orderId);
            if (!order) return;

            const orderTime = new Date(order.fecha_creacion);
            const timeDiff = Math.floor((Date.now() - orderTime.getTime()) / 60000);
            
            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <h3 style="color: var(--primary-color); margin-bottom: 2rem; font-size: 2rem;">
                    📋 Detalles de ${order.mesa}
                </h3>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-bottom: 2rem;">
                    <div style="background: var(--light-bg); padding: 1.5rem; border-radius: 12px;">
                        <h4 style="margin-bottom: 1rem; color: var(--primary-color);">📊 Información General</h4>
                        <p style="margin-bottom: 0.5rem;"><strong>Mesa:</strong> ${order.mesa}</p>
                        <p style="margin-bottom: 0.5rem;"><strong>Estado:</strong> <span class="order-status-badge status-${order.estado}">${ORDER_STATES[order.estado].label}</span></p>
                        <p style="margin-bottom: 0.5rem;"><strong>Tiempo:</strong> ${timeDiff} minutos</p>
                        <p style="margin-bottom: 0.5rem;"><strong>Prioridad:</strong> ${order.prioridad || 'NORMAL'}</p>
                    </div>
                    <div style="background: var(--light-bg); padding: 1.5rem; border-radius: 12px;">
                        <h4 style="margin-bottom: 1rem; color: var(--primary-color);">📈 Resumen</h4>
                        <p style="margin-bottom: 0.5rem;"><strong>Total items:</strong> ${order.items.length}</p>
                        <p style="margin-bottom: 0.5rem;"><strong>Pendientes:</strong> ${order.items.filter(i => i.estado === 'pendiente').length}</p>
                        <p style="margin-bottom: 0.5rem;"><strong>En preparación:</strong> ${order.items.filter(i => i.estado === 'en_preparacion').length}</p>
                        <p style="margin-bottom: 0.5rem;"><strong>Listos:</strong> ${order.items.filter(i => i.estado === 'listo').length}</p>
                        <p><strong>Total:</strong> <span style="font-size: 1.4rem; color: var(--success-color); font-weight: bold;">$${order.total.toLocaleString('es-CL')}</span></p>
                    </div>
                </div>
                
                <h4 style="margin-bottom: 1.5rem; color: var(--primary-color); font-size: 1.5rem;">🍽️ Items del Pedido</h4>
                <div style="space-y: 1rem;">
                    ${order.items.map(item => `
                        <div style="background: var(--light-bg); border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; border: 2px solid #e2e8f0;">
                            ${createOrderItem(item, order.id)}
                        </div>
                    `).join('')}
                </div>
                
                ${order.notas ? `
                    <div style="margin-top: 2rem; padding: 1.5rem; background: linear-gradient(135deg, #e6fffa 0%, #b2f5ea 100%); border-radius: 12px; border-left: 4px solid #4fd1c7;">
                        <strong style="color: var(--primary-color); font-size: 1.1rem;">📝 Notas:</strong>
                        <p style="margin-top: 0.5rem; font-size: 1rem;">${order.notas}</p>
                    </div>
                ` : ''}
            `;
            
            document.getElementById('orderModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('orderModal').classList.remove('show');
        }

        function showNotification(message, type = 'info') {
            // Remover notificación existente si la hay
            const existingNotification = document.querySelector('.notification');
            if (existingNotification) {
                existingNotification.remove();
            }

            const icons = {
                success: '✅',
                error: '❌',
                warning: '⚠️',
                info: 'ℹ️'
            };

            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.innerHTML = `
                <span style="font-size: 1.2rem;">${icons[type] || icons.info}</span>
                <span>${message}</span>
            `;
            
            document.body.appendChild(notification);
            
            // Mostrar notificación
            setTimeout(() => notification.classList.add('show'), 100);
            
            // Ocultar notificación después de 4 segundos
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => notification.remove(), 400);
            }, 4000);
        }

        // ==========================================
        // FUNCIONES DE AUTO-REFRESH
        // ==========================================
        
        function toggleAutoRefresh() {
            const toggle = document.getElementById('autoRefreshToggle');
            
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
                toggle.classList.remove('active');
                showNotification('🔄 Auto-actualización desactivada', 'info');
            } else {
                autoRefreshInterval = setInterval(() => {
                    if (currentSection === 'kitchen' || currentSection === 'dashboard') {
                        refreshCurrentSection();
                    }
                }, 10000); // 10 segundos
                
                toggle.classList.add('active');
                showNotification('🔄 Auto-actualización activada (10s)', 'success');
            }
        }

        function refreshCurrentSection() {
            switch (currentSection) {
                case 'dashboard':
                    refreshDashboard();
                    break;
                case 'kitchen':
                    refreshKitchen();
                    break;
                case 'admin':
                    refreshAdmin();
                    break;
            }
        }

        // ==========================================
        // FUNCIONES ADICIONALES
        // ==========================================
        
        function logout() {
            if (confirm('🚪 ¿Cerrar sesión?')) {
                showNotification('👋 Sesión cerrada correctamente', 'info');
                // Aquí se implementaría la lógica de logout real
                // window.location.reload();
            }
        }

        // ==========================================
        // INICIALIZACIÓN
        // ==========================================
        
        document.addEventListener('DOMContentLoaded', function() {
            // Inicializar dashboard
            refreshDashboard();
            
            // Activar auto-refresh por defecto
            toggleAutoRefresh();
            
            // Cerrar modal al hacer clic fuera
            document.getElementById('orderModal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeModal();
                }
            });
            
            console.log('🍽️ Sistema de Cocina Táctil - Iniciado correctamente');
            showNotification('🎉 Sistema iniciado correctamente', 'success');
        });

        // Cerrar modal con tecla Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // Prevenir zoom accidental en dispositivos táctiles
        document.addEventListener('gesturestart', function (e) {
            e.preventDefault();
        });

        document.addEventListener('gesturechange', function (e) {
            e.preventDefault();
        });

        document.addEventListener('gestureend', function (e) {
            e.preventDefault();
        });
    </script>
</body>
</html>
